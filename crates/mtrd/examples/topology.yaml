options:
  background:
    color: '#FFFFFF'
  coordinates:
    type: cartesian
    axes: r-d
  labels:
    hidden: true
  languages:
    set:
    - en
    primary: en
  density-reshape:
    estimator: vertex-kde
    bandwidth:
      factor: 1.0
    mesh-cell-size:
      factor: 1.0
    raster-pixel-size:
      factor: 1.0
    padding:
      factor: 1.0
    station-weight:
      factor: 1.0
    segment-weight:
      factor: 1.0
    density-floor:
      factor: 1.0
  lines:
    width: 5.0
  scale: 1.0
  stations:
    common:
      fill:
        diameter: 6.25
        color:
          type: unified
          value: '#FFFFFF'
      stroke:
        width: 1.25
        alignment: outside
        color:
          type: follow-line
    interchange:
      fill:
        width: 7.5
        color: '#FFFFFF'
      stroke:
        width: 1.25
        alignment: outside
        color: '#000000'
